# M15 strategy parameters for the tournament (skills/run_backtest_tournament.py).
# Units: points, 1 point = $0.01 on XAUUSD (see broker_costs.yaml).

data:
  csv: data/history/XAUUSD_{timeframe}.csv   # fetch: python -m core.data_ingestion.mt5_history --timeframe H1 --out ...
  in_sample_fraction: 0.7          # first 70% of bars for the grid search, last 30% held out
  # MT5 bar `spread` is the MINIMUM spread seen inside the bar (median 4-12
  # points in this history) -- far below a live retail quote (~30-40). The
  # backtest uses max(bar spread, this floor) so costs are not understated.
  # 35 = live XAUUSD quote on MetaQuotes-Demo, 2026-10-04 (35 points = $0.35
  # = 3.5 "pips" in the $0.10-pip convention).
  spread_floor_points: 35

baseline:                          # stand-in for the original EA (its .mq5 is not in the repo)
  fast_ema: 20
  slow_ema: 50
  fixed_lot: 0.01
  stop_loss_points: 1000           # no TP; exits on the opposite crossover or the stop

atr_trend:
  fast_ema: 20
  slow_ema: 50
  trend_ema: 200                   # trade only in the direction of EMA200 ...
  trend_slope_bars: 8              # ... and only while EMA200 is sloping that way over this many bars
  atr_period: 14
  adx_period: 14
  adx_min: 25                      # side-way filter: no entries while ADX is below this
  sl_atr_mult: 2.0                 # initial stop distance = mult * ATR
  reward_risk: 2.0                 # TP distance = reward_risk * stop distance (Shield requires >= 1.5)
  trail_atr_mult: 3.0              # chandelier trail from the best price once 1R in profit

mtf_pullback:
  htf_minutes: 60                  # bias timeframe: 60 = H1, 240 = H4 (built from closed M15 bars)
  htf_ema: 200
  htf_slope_bars: 5                # HTF EMA must be rising (falling) over this many HTF bars
  pullback_ema: 20                 # M15 EMA the pullback must reach
  pullback_bars: 6                 # ... within this many bars before the trigger
  atr_period: 14
  stop_buffer_atr: 0.25            # stop = pullback extreme + buffer x ATR ...
  min_sl_atr: 0.75                 # ... clamped to [min, max] x ATR
  max_sl_atr: 2.5
  reward_risk: 2.0
  trail_atr_mult: 3.0
  session_hours: null              # [start, end) broker server hours, null = all day

session_breakout:
  session: [3, 10, 14]             # [range_start, range_end, trade_end) server hours: Asian range -> London open
  exit_hour: 22                    # flat by this server hour (before rollover swap)
  squeeze_factor: 1.0              # range <= factor x median of recent ranges (99 = filter off)
  squeeze_lookback: 20
  atr_period: 14
  min_sl_atr: 0.75                 # stop at range midpoint, clamped to [min, max] x ATR
  max_sl_atr: 3.0
  reward_risk: 2.0
  trail_atr_mult: 3.0

mean_reversion_bands:
  bb_period: 20
  bb_k: 2.0
  rsi_period: 14
  rsi_low: 30                      # long needs RSI <= this on the outside-band bar; short needs >= 100 - this
  htf_minutes: 60                  # only fade in the HTF bias direction; null = no filter
  htf_ema: 200
  htf_slope_bars: 5
  extreme_bars: 3                  # stop beyond the extreme of the last N bars ...
  stop_buffer_atr: 0.25            # ... plus this buffer, clamped to [min, max] x ATR
  atr_period: 14
  min_sl_atr: 0.75
  max_sl_atr: 2.5
  reward_risk: 1.5
  trail_atr_mult: 3.0

# In-sample grids. Each strategy's winner is scored once on held-out data.
optimization:
  min_trades: 30
  grids:
    atr_trend:
      adx_min: [20, 25, 30]
      sl_atr_mult: [1.5, 2.0, 3.0]
      reward_risk: [1.5, 2.0, 3.0]
    mtf_pullback:
      htf_minutes: [60, 240]
      reward_risk: [1.5, 2.0, 3.0]
      session_hours: [null, [10, 22]]   # 10-22 server time (GMT+2/3) ~ London open to NY afternoon
    session_breakout:
      session: [[3, 10, 14], [12, 16, 20]]   # London open; NY open (range 12-16, trade 16-20)
      squeeze_factor: [0.8, 1.0, 99]
      reward_risk: [1.5, 2.0, 3.0]
    mean_reversion_bands:
      htf_minutes: [60, 240, null]
      rsi_low: [25, 30]
      reward_risk: [1.5, 2.0]

# Per-timeframe overrides, applied on top of the sections above
# (run the skills with --timeframe M15|H1|H4). `params` patch a strategy's
# defaults, `grids` patch its optimization grid. Any htf_minutes must be
# larger than the timeframe itself (load_config enforces it).
timeframes:
  M15:
    base_minutes: 15
  H1:
    base_minutes: 60
    params:
      mtf_pullback: {htf_minutes: 240}
      mean_reversion_bands: {htf_minutes: 240}
    grids:
      mtf_pullback: {htf_minutes: [240, 1440]}
      mean_reversion_bands: {htf_minutes: [240, 1440, null]}
  H4:
    base_minutes: 240
    params:
      mtf_pullback: {htf_minutes: 1440}
      session_breakout: {exit_hour: 20}     # H4 bars open at 0/4/.../20 server time
      mean_reversion_bands: {htf_minutes: 1440}
    grids:
      mtf_pullback: {htf_minutes: [1440]}
      mean_reversion_bands: {htf_minutes: [1440, null]}
